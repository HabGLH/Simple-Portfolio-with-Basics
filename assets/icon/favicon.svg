<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Bracket Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Bracket Amber Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle with Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="16" />

  <!-- Subtle Inner Border -->
  <rect x="36" y="36" width="440" height="440" rx="100" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2" />

  <!-- Monogram Group < H > -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 160 172 L 92 256 L 160 340" fill="none" stroke="url(#blueGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Letter H -->
    <path d="M 212 172 L 212 340 M 300 172 L 300 340 M 212 256 L 300 256" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Bracket > -->
    <path d="M 352 172 L 420 256 L 352 340" fill="none" stroke="url(#amberGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Online / Active Status Dot -->
  <circle cx="414" cy="414" r="24" fill="#10b981" stroke="#0f172a" stroke-width="6" />
</svg>
